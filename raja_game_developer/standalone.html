<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProbQuest — Learn Probability & Random Variables Through Play</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React-DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            quest: {
              dark: '#070a13',
              card: 'rgba(18, 24, 43, 0.75)',
              border: 'rgba(79, 110, 247, 0.25)',
              primary: '#6366f1',
              accent: '#06b6d4',
              neon: '#10b981',
              gold: '#f59e0b',
            }
          },
          fontFamily: {
            sans: ['Outfit', 'Inter', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          },
          boxShadow: {
            'glow-primary': '0 0 25px rgba(99, 102, 241, 0.35)',
            'glow-accent': '0 0 25px rgba(6, 182, 212, 0.35)',
            'glow-gold': '0 0 25px rgba(245, 158, 11, 0.45)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #070a13;
      background-image: 
        radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s ease;
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }
    .glow-text-cyan { text-shadow: 0 0 12px rgba(6, 182, 212, 0.6); }
  </style>
</head>
<body class="bg-[#070a13] text-slate-100 font-sans min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ZONES METADATA ---
    const ZONES = [
      { id: 'z1', unit: 1, title: 'Treasure Chest Odds', concept: 'Basic Probability & Sample Space', xp: 150, formula: 'P(A) = |A| / |S|', desc: 'Predict item draw frequencies from chests with visible items.' },
      { id: 'z2', unit: 1, title: 'Detective Board: The 3 Thieves', concept: 'Conditional Probability & Bayes Theorem', xp: 200, formula: 'P(Thief | Clues) = P(Clues | Thief) × P(Thief) / P(Clues)', desc: 'Inspect forensic clues from a bank heist to identify the thief among 3 suspects.' },
      { id: 'z3', unit: 1, title: 'Two Dice Duel', concept: 'Event Independence', xp: 200, formula: 'P(A ∩ B) = P(A) × P(B)', desc: 'Test if die 1 outcomes are independent from die 2.' },
      { id: 'z4', unit: 1, title: 'Medical Diagnosis Lab', concept: "Bayes' Theorem", xp: 250, formula: 'P(A|B) = P(B|A)P(A) / P(B)', desc: 'Update disease presence belief given false-positive rates.' },
      { id: 'z5', unit: 1, title: 'Loot Table Builder', concept: 'Discrete RV & CDF', xp: 200, formula: 'F(x) = P(X ≤ x) = ∑ p(x_i)', desc: 'Assign loot rarities and plot step-function CDF.' },
      { id: 'z6', unit: 1, title: 'Fair Game or Not?', concept: 'Expected Value & Variance', xp: 220, formula: 'E[X] = ∑ x p(x)', desc: 'Compute expected winnings and risk of slot wagers.' },
      { id: 'z7', unit: 1, title: 'Archery Trials', concept: 'Binomial Distribution B(n, p)', xp: 250, formula: 'P(X=k) = nCk p^k (1-p)^(n-k)', desc: 'Simulate volley hit trials vs theoretical Binomial curve.' },
      { id: 'z8', unit: 1, title: 'Call Center Rush', concept: 'Poisson Distribution Poisson(λ)', xp: 250, formula: 'P(X=k) = λ^k e^-λ / k!', desc: 'Model random call arrivals per time unit interval.' },
      { id: 'z9', unit: 1, title: 'First Strike', concept: 'Geometric Distribution Geo(p)', xp: 250, formula: 'P(X=k) = (1-p)^(k-1) p', desc: 'Predict attempt of 1st critical hit given crit chance.' },
      { id: 'z10', unit: 2, title: 'River Depth Explorer', concept: 'Continuous RVs & CDF', xp: 250, formula: 'P(a ≤ X ≤ b) = ∫ f(x) dx', desc: 'Continuous depth sensor reading interval probabilities.' },
      { id: 'z11', unit: 2, title: 'Balance the Beam', concept: 'Continuous Mean & Variance', xp: 280, formula: 'E[X] = ∫ x f(x) dx', desc: 'Visually balance continuous PDF shape on a fulcrum.' },
      { id: 'z12', unit: 2, title: 'Spinner Wheel Lab', concept: 'Uniform Distribution U(a,b)', xp: 250, formula: 'f(x) = 1 / (b - a)', desc: 'Continuous dial spinner with equal likelihood angles.' },
      { id: 'z13', unit: 2, title: 'Waiting Room', concept: 'Exponential Distribution Exp(λ)', xp: 280, formula: 'F(t) = 1 - e^-λt', desc: 'Models customer waiting times between random arrivals.' },
      { id: 'z14', unit: 2, title: 'Bell Curve Archery', concept: 'Normal Distribution N(μ, σ²)', xp: 300, formula: 'Z = (X - μ) / σ', desc: 'Z-score marksmanship with shaded Gaussian area.' },
    ];

    // --- MAIN APP ---
    function App() {
      const [activeTab, setActiveTab] = useState('map');
      const [selectedZone, setSelectedZone] = useState(null);
      const [xp, setXp] = useState(850);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header HUD */}
          <header className="sticky top-0 z-50 glass-panel border-b border-indigo-500/20 px-6 py-3">
            <div className="max-w-7xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setActiveTab('map'); setSelectedZone(null); }}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-400 p-0.5 shadow-glow-primary">
                  <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center text-lg">🎲</div>
                </div>
                <div>
                  <h1 className="font-extrabold text-xl text-white">Prob<span className="text-cyan-400">Quest</span></h1>
                  <p className="text-[10px] text-slate-400 uppercase font-mono">CO1 Discrete & Continuous RVs</p>
                </div>
              </div>

              <div className="flex items-center gap-4">
                <div className="bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800 text-xs font-mono text-indigo-300">
                  ⚡ {xp} XP (Level {Math.floor(xp / 500) + 1})
                </div>
                <a 
                  href="thief_game.html" 
                  target="_blank"
                  className="bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-glow-gold transition"
                >
                  🕵️ Play 3 Thieves Heist Game
                </a>
                <nav className="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                  {['map', 'codex', 'mastery', 'instructor'].map(tab => (
                    <button 
                      key={tab}
                      onClick={() => { setActiveTab(tab); setSelectedZone(null); }}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold uppercase ${activeTab === tab ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
                    >
                      {tab}
                    </button>
                  ))}
                </nav>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">
            {selectedZone ? (
              <div className="glass-panel p-8 rounded-3xl border border-indigo-500/30 space-y-6">
                <button onClick={() => setSelectedZone(null)} className="text-xs text-indigo-400 font-semibold">← Back to Map</button>
                <div>
                  <span className="text-xs uppercase text-slate-400 font-mono">Unit {selectedZone.unit}</span>
                  <h2 className="text-3xl font-extrabold text-white">{selectedZone.title}</h2>
                  <p className="text-sm text-cyan-400">{selectedZone.concept}</p>
                </div>
                <div className="bg-slate-950 p-4 rounded-xl text-cyan-300 font-mono font-bold text-lg">
                  Formula: {selectedZone.formula}
                </div>
                <div className="bg-slate-900/60 p-6 rounded-2xl border border-slate-800">
                  <p className="text-sm text-slate-300">{selectedZone.desc}</p>
                  <a 
                    href="thief_game.html" 
                    target="_blank"
                    className="inline-block mt-4 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-glow-primary"
                  >
                    Launch Interactive 3 Thieves Bank Heist Game →
                  </a>
                </div>
              </div>
            ) : (
              activeTab === 'map' ? (
                <div className="space-y-6">
                  <div className="glass-card p-6 rounded-3xl border border-indigo-500/30 bg-gradient-to-r from-indigo-950 to-slate-900 flex justify-between items-center flex-wrap gap-4">
                    <div>
                      <h2 className="text-3xl font-extrabold text-white">Probability Island Quest Map</h2>
                      <p className="text-sm text-slate-300 mt-1">Select any zone to launch interactive mini-games and quizzes.</p>
                    </div>
                    <a 
                      href="thief_game.html" 
                      target="_blank"
                      className="bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-extrabold text-xs px-5 py-2.5 rounded-xl shadow-glow-gold transition hover:scale-105"
                    >
                      🕵️ Featured Game: "The 3 Thieves Bank Heist" →
                    </a>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    {ZONES.map(z => (
                      <div 
                        key={z.id} 
                        onClick={() => setSelectedZone(z)}
                        className="glass-card p-5 rounded-2xl border border-slate-800 cursor-pointer hover:border-indigo-500 hover:-translate-y-1 transition"
                      >
                        <div className="flex justify-between items-center mb-2">
                          <span className="text-[10px] uppercase font-bold text-indigo-400 font-mono">Unit {z.unit}</span>
                          <span className="text-xs font-mono text-amber-400">+{z.xp} XP</span>
                        </div>
                        <h3 className="font-extrabold text-white text-base">{z.title}</h3>
                        <p className="text-xs text-cyan-400 my-1">{z.concept}</p>
                        <p className="text-xs text-slate-400 line-clamp-2 mt-2">{z.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ) : activeTab === 'codex' ? (
                <div className="glass-panel p-8 rounded-3xl border border-indigo-500/30 space-y-4">
                  <h2 className="text-2xl font-extrabold text-white">In-Game Formula Codex</h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {ZONES.map(z => (
                      <div key={z.id} className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                        <span className="text-xs text-indigo-400 block font-bold">{z.title}</span>
                        <code className="text-sm text-cyan-300 font-mono block mt-1">{z.formula}</code>
                      </div>
                    ))}
                  </div>
                </div>
              ) : activeTab === 'mastery' ? (
                <div className="glass-panel p-8 rounded-3xl border border-indigo-500/30 space-y-4">
                  <h2 className="text-2xl font-extrabold text-white">Mastery Dashboard & CO1 Attainment</h2>
                  <div className="text-3xl font-mono text-cyan-400 font-bold">Attainment: 85%</div>
                </div>
              ) : (
                <div className="glass-panel p-8 rounded-3xl border border-indigo-500/30 space-y-4">
                  <h2 className="text-2xl font-extrabold text-white">Instructor Analytics & OBE Export</h2>
                  <p className="text-xs text-slate-300">Enrolled Students: 48 | Average Score: 84.2%</p>
                </div>
              )
            )}
          </main>

          <footer className="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
            🎲 ProbQuest — Course Outcome CO1 Educational Game
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
