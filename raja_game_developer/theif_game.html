<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Master Bank Robbery — 6 Thieves & 6 Clues Detective Game</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React-DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'Inter', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          },
          boxShadow: {
            'glow-primary': '0 0 25px rgba(99, 102, 241, 0.4)',
            'glow-cyan': '0 0 25px rgba(6, 182, 212, 0.4)',
            'glow-gold': '0 0 25px rgba(245, 158, 11, 0.4)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #070a13;
      background-image: 
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(6, 182, 212, 0.18) 0px, transparent 50%);
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .glow-text { text-shadow: 0 0 12px rgba(6, 182, 212, 0.7); }
  </style>
</head>
<body class="bg-[#070a13] text-slate-100 font-sans min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUSPECTS = [
      { id: 't1', name: 'RAJA', alias: 'The Lockpicker', icon: '👽', color: 'from-amber-500 to-orange-600', traits: { handedness: 'Left', bootSize: 10, bloodType: 'O', heightCategory: 'Medium', tattoo: 'Snake', favoriteTool: 'Lockpick' } },
      { id: 't2', name: 'SHAITH', alias: 'The Acrobat', icon: '🗡️', color: 'from-purple-600 to-indigo-600', traits: { handedness: 'Right', bootSize: 10, bloodType: 'A', heightCategory: 'Tall', tattoo: 'Dragon', favoriteTool: 'Laser' } },
      { id: 't3', name: 'MANI', alias: 'The Demolitionist', icon: '🐍', color: 'from-emerald-500 to-teal-600', traits: { handedness: 'Left', bootSize: 8, bloodType: 'B', heightCategory: 'Short', tattoo: 'None', favoriteTool: 'Explosives' } },
      { id: 't4', name: 'FAZIL', alias: 'The Safe Cracker', icon: '🐱', color: 'from-pink-500 to-rose-600', traits: { handedness: 'Right', bootSize: 8, bloodType: 'O', heightCategory: 'Short', tattoo: 'Cat', favoriteTool: 'Stethoscope' } },
      { id: 't5', name: 'TEREX', alias: 'The Cyber Hacker', icon: '🦅', color: 'from-cyan-500 to-blue-600', traits: { handedness: 'Left', bootSize: 11, bloodType: 'AB', heightCategory: 'Tall', tattoo: 'Falcon', favoriteTool: 'Cyber Deck' } },
      { id: 't6', name: 'MERIN', alias: 'The Enforcer', icon: '🐺', color: 'from-slate-600 to-gray-800', traits: { handedness: 'Right', bootSize: 11, bloodType: 'A', heightCategory: 'Tall', tattoo: 'Wolf', favoriteTool: 'Crowbar' } }
    ];

    function App() {
      const [guiltyId, setGuiltyId] = useState('t1');
      const [caseClues, setCaseClues] = useState([]);
      const [discoveredClues, setDiscoveredClues] = useState([]);
      const [accusedId, setAccusedId] = useState(null);
      const [isSolved, setIsSolved] = useState(false);

      const generateCaseForGuiltyThief = (targetGuiltyId) => {
        const thief = SUSPECTS.find(s => s.id === targetGuiltyId) || SUSPECTS[0];

        const generatedClues = [
          { id: 'c_hand', name: `${thief.traits.handedness}-Handed Palm Print`, icon: thief.traits.handedness === 'Left' ? '✋' : '🤚', location: 'Vault Outer Handle', desc: `Palm imprint matches a ${thief.traits.handedness}-handed suspect.`, getLikelihood: (s) => s.traits.handedness === thief.traits.handedness ? 0.90 : 0.10 },
          { id: 'c_boot', name: `Size ${thief.traits.bootSize} Boot Tread`, icon: '🥾', location: 'Escape Window Sill', desc: `Tread dimensions measure Size ${thief.traits.bootSize} boot.`, getLikelihood: (s) => s.traits.bootSize === thief.traits.bootSize ? 0.88 : 0.12 },
          { id: 'c_blood', name: `Blood Type ${thief.traits.bloodType} DNA`, icon: '🩸', location: 'Laser Grid Glass Edge', desc: `Blood droplet typing confirms Blood Group ${thief.traits.bloodType}.`, getLikelihood: (s) => s.traits.bloodType === thief.traits.bloodType ? 0.95 : 0.05 },
          { id: 'c_height', name: `Height Beam: ${thief.traits.heightCategory}`, icon: '📏', location: 'Corridor Security Beam', desc: `Laser broken at height category ${thief.traits.heightCategory}.`, getLikelihood: (s) => s.traits.heightCategory === thief.traits.heightCategory ? 0.85 : 0.15 },
          { id: 'c_tattoo', name: `${thief.traits.tattoo !== 'None' ? thief.traits.tattoo + ' Ink Fiber' : 'No Tattoo Fiber'}`, icon: '🎨', location: 'Ventilation Shaft Catch', desc: `Fabric fiber contains ${thief.traits.tattoo !== 'None' ? thief.traits.tattoo + ' pigment tattoo ink' : 'clean unpigmented fiber'}.`, getLikelihood: (s) => s.traits.tattoo === thief.traits.tattoo ? 0.92 : 0.08 },
          { id: 'c_tool', name: `${thief.traits.favoriteTool} Scratches`, icon: '🔧', location: 'Inner Safe Lock Plate', desc: `Tool mark examination reveals unique wear from a ${thief.traits.favoriteTool}.`, getLikelihood: (s) => s.traits.favoriteTool === thief.traits.favoriteTool ? 0.96 : 0.04 }
        ];

        setCaseClues(generatedClues);
        setDiscoveredClues([]);
        setAccusedId(null);
        setIsSolved(false);
      };

      useEffect(() => {
        generateCaseForGuiltyThief(guiltyId);
      }, [guiltyId]);

      const calculatePosteriors = () => {
        const prior = 1 / 6;
        let totalJoint = 0;
        const jointMap = {};

        SUSPECTS.forEach(s => {
          let joint = prior;
          discoveredClues.forEach(cid => {
            const clue = caseClues.find(c => c.id === cid);
            if (clue) joint *= clue.getLikelihood(s);
          });
          jointMap[s.id] = joint;
          totalJoint += joint;
        });

        const posteriors = {};
        SUSPECTS.forEach(s => {
          posteriors[s.id] = totalJoint > 0 ? (jointMap[s.id] / totalJoint) : prior;
        });

        return posteriors;
      };

      const posteriors = calculatePosteriors();

      const toggleClue = (cid) => {
        if (isSolved) return;
        setDiscoveredClues(prev => 
          prev.includes(cid) ? prev.filter(id => id !== cid) : [...prev, cid]
        );
      };

      const handleAccuse = (sid) => {
        setAccusedId(sid);
        setIsSolved(true);
        if (sid === guiltyId) {
          confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 } });
        }
      };

      const handleNewCase = () => {
        const nextGuilty = SUSPECTS[Math.floor(Math.random() * SUSPECTS.length)].id;
        setGuiltyId(nextGuilty);
        generateCaseForGuiltyThief(nextGuilty);
      };

      const guiltySuspect = SUSPECTS.find(s => s.id === guiltyId);

      return (
        <div className="max-w-7xl mx-auto px-6 py-8 space-y-8">
          {/* Header */}
          <header className="glass-card p-6 rounded-3xl border border-indigo-500/30 flex flex-wrap justify-between items-center gap-4 bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 shadow-glow-primary">
            <div>
              <span className="text-xs uppercase font-mono text-cyan-400 font-bold">Complex Multi-Variable Bayesian Game</span>
              <h1 className="text-3xl font-extrabold text-white">The Master Bank Robbery — 6 Thieves & 6 Clues</h1>
              <p className="text-xs text-slate-300 mt-1">Inspect 6 crime scene clues to compute Bayesian probability across 6 master thieves!</p>
            </div>
            <button onClick={handleNewCase} className="bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 text-white font-extrabold text-xs px-5 py-2.5 rounded-xl shadow-glow-cyan transition hover:scale-105">
              🔄 Pick Random Thief & New 6-Clue Case
            </button>
          </header>

          {/* 6 Clues Board */}
          <div>
            <h2 className="text-xs font-bold uppercase text-slate-400 mb-3 tracking-wider flex items-center gap-2">
              🔎 Crime Scene Forensic Evidence ({discoveredClues.length} / {caseClues.length} Active)
            </h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
              {caseClues.map(c => {
                const active = discoveredClues.includes(c.id);
                return (
                  <div 
                    key={c.id} 
                    onClick={() => toggleClue(c.id)}
                    className={`glass-panel p-4 rounded-2xl border cursor-pointer transition-all duration-300 ${
                      active ? 'border-cyan-400 bg-indigo-950/40 shadow-glow-cyan scale-105' : 'border-slate-800 opacity-60'
                    }`}
                  >
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-2xl">{c.icon}</span>
                      <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full border ${active ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40' : 'bg-slate-800 text-slate-500'}`}>
                        {active ? 'EVIDENCE ACTIVE' : 'INSPECT SITE'}
                      </span>
                    </div>
                    <h3 className="font-extrabold text-sm text-white">{c.name}</h3>
                    <span className="text-[10px] text-indigo-400 font-mono block">📍 {c.location}</span>
                    <p className="text-xs text-slate-300 mt-2">{c.desc}</p>
                  </div>
                );
              })}
            </div>
          </div>

          {/* 6 Suspect Profiles */}
          <div>
            <h2 className="text-xs font-bold uppercase text-slate-400 mb-3 tracking-wider">👤 6 Suspect Profiles & Real-Time Probability Meters</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {SUSPECTS.map(s => {
                const prob = posteriors[s.id] || (1 / 6);
                const probPct = (prob * 100).toFixed(1);
                const isTop = Math.max(...Object.values(posteriors)) === prob;

                return (
                  <div 
                    key={s.id}
                    className={`glass-card p-5 rounded-3xl border flex flex-col justify-between transition-all duration-300 ${
                      isTop && discoveredClues.length > 0 ? 'border-cyan-400 shadow-glow-cyan bg-indigo-950/40 scale-105' : 'border-slate-800'
                    }`}
                  >
                    <div>
                      <div className="flex items-center gap-3 mb-3">
                        <div className={`w-11 h-11 rounded-2xl bg-gradient-to-tr ${s.color} flex items-center justify-center text-xl`}>
                          {s.icon}
                        </div>
                        <div>
                          <h3 className="font-extrabold text-sm text-white">{s.name}</h3>
                          <span className="text-[11px] text-indigo-400 font-mono">{s.alias}</span>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-1 text-[11px] text-slate-300 bg-slate-950 p-2.5 rounded-xl border border-slate-800 mb-3 font-mono">
                        <div><span className="text-slate-500">Hand:</span> <span className="text-white font-bold">{s.traits.handedness}</span></div>
                        <div><span className="text-slate-500">Boot:</span> <span className="text-white font-bold">Size {s.traits.bootSize}</span></div>
                        <div><span className="text-slate-500">Blood:</span> <span className="text-white font-bold">Type {s.traits.bloodType}</span></div>
                        <div><span className="text-slate-500">Height:</span> <span className="text-white font-bold">{s.traits.heightCategory}</span></div>
                        <div><span className="text-slate-500">Tattoo:</span> <span className="text-white font-bold">{s.traits.tattoo}</span></div>
                        <div><span className="text-slate-500">Tool:</span> <span className="text-white font-bold truncate">{s.traits.favoriteTool}</span></div>
                      </div>

                      <div className="space-y-1">
                        <div className="flex justify-between text-xs font-bold">
                          <span className="text-slate-400 text-[10px] uppercase">Guilt Chance</span>
                          <span className="text-cyan-400 font-mono glow-text">{probPct}%</span>
                        </div>
                        <div className="h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                          <div className="h-full bg-gradient-to-r from-indigo-500 to-cyan-400 transition-all duration-500" style={{ width: `${probPct}%` }} />
                        </div>
                      </div>
                    </div>

                    <button 
                      disabled={isSolved}
                      onClick={() => handleAccuse(s.id)}
                      className="mt-4 w-full py-2 rounded-xl font-bold text-xs bg-gradient-to-r from-rose-600 to-indigo-600 hover:from-rose-500 text-white shadow-glow-primary transition disabled:opacity-40"
                    >
                      Accuse {s.name}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Result Banner */}
          {isSolved && (
            <div className={`p-6 rounded-3xl border text-center space-y-2 ${accusedId === guiltyId ? 'bg-emerald-950/90 border-emerald-500' : 'bg-rose-950/90 border-rose-500'}`}>
              <h3 className="text-2xl font-extrabold text-white">
                {accusedId === guiltyId ? '🎉 Correct Accusation! Guilty Thief Arrested!' : '❌ Wrong Accusation! The Thief Escaped!'}
              </h3>
              <p className="text-xs text-slate-300">
                {accusedId === guiltyId 
                  ? `Multi-variable Bayesian deduction correctly pinpointed ${guiltySuspect?.name}!` 
                  : `The actual thief who committed this heist was ${guiltySuspect?.name} (${guiltySuspect?.alias}).`}
              </p>
              <button onClick={handleNewCase} className="mt-2 bg-indigo-600 text-white text-xs font-semibold px-5 py-2.5 rounded-xl">Play Next 6-Thief Case →</button>
            </div>
          )}

          {/* Math Proof */}
          <div className="glass-panel p-6 rounded-3xl border border-indigo-500/30 space-y-3 font-mono text-xs">
            <h3 className="text-sm font-bold text-indigo-400 uppercase">⚡ 6-Variable Bayes' Theorem Proof</h3>
            <div className="bg-slate-950 p-4 rounded-xl text-cyan-300 text-xs font-bold">
              P(Thief_i | C_1..C_6) = [ P(T_i) × ∏_{j=1}^{6} P(C_j | Thief_i) ] / ∑_{k=1}^{6} [ P(T_k) × ∏_{j=1}^{6} P(C_j | Thief_k) ]
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
